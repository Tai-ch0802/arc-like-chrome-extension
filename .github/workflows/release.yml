name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false # 上傳走 gh + GH_TOKEN，不需要 git 憑證

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22' # Node.js 20 已於 2026-04-30 EOL
        # 發版不使用快取：被污染的 npm 快取會直接進到上架的 zip（cache poisoning）
        package-manager-cache: false

    - name: Install dependencies
      env:
        PUPPETEER_SKIP_DOWNLOAD: 'true' # 打包不需要 Chrome，少下載一個大型 binary
      run: npm ci

    - name: Build production package
      run: make release

    - name: Upload release asset
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 動態值經環境變數傳入，不直接展開進 shell（template injection 防護）
        TAG_NAME: ${{ github.event.release.tag_name }}
      run: gh release upload "$TAG_NAME" arc-sidebar-v*.zip
